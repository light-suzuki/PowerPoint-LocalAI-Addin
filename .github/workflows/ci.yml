name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore test project
        run: dotnet restore LocalPptSkillAgent.Tests/LocalPptSkillAgent.Tests.csproj
      - name: Test
        run: dotnet test LocalPptSkillAgent.Tests/LocalPptSkillAgent.Tests.csproj --configuration Release --no-restore
